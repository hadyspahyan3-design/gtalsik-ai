name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential ccache git libffi-dev libssl-dev \
            python3-pip zip openjdk-17-jdk autoconf libtool \
            libtool-bin automake pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev cmake aidl

      - name: Install Buildozer
        run: |
          pip install --user buildozer cython
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build with Buildozer
        run: |
          buildozer android debug
        env:
          BUILDOZER_WARN_ON_ROOT: 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gtalsik-apk
          path: bin/*.apk
