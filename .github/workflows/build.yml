name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential ccache git libffi-dev libssl-dev \
            python3-pip zip openjdk-17-jdk autoconf libtool \
            libtool-bin automake pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev cmake

          echo "=== Searching for aidl ==="
          sudo find / -name "aidl" -type f 2>/dev/null | head -5 || true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "build-tools;33.0.2" "platforms;android-33"
          ls -la $ANDROID_HOME/build-tools/33.0.2/ | grep aidl || true
          echo "$ANDROID_HOME/build-tools/33.0.2" >> $GITHUB_PATH

      - name: Install Buildozer
        run: |
          pip install --user buildozer cython
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:$ANDROID_HOME/build-tools/33.0.2
          buildozer android debug
        env:
          BUILDOZER_WARN_ON_ROOT: 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gtalsik-apk
          path: bin/*.apk
